[build]
  command = "python3 scripts/build_cards.py"
  publish = "dist"

# Keystatic SPA client-side routing
[[redirects]]
  from = "/keystatic/*"
  to = "/keystatic/index.html"
  status = 200

# Legacy path redirects to /nstokes
[[redirects]]
  from = "/vcard/nicky"
  to = "/nstokes"
  status = 301

[[redirects]]
  from = "/nicky"
  to = "/nstokes"
  status = 301

# Root redirects to primary card /nstokes
[[redirects]]
  from = "/"
  to = "/nstokes"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment"

[[headers]]
  for = "/public/vcf/*"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment"

[[headers]]
  for = "/vcf/*"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment"
