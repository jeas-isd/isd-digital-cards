[build]
  command = "python3 scripts/build_cards.py && mkdir -p dist && cp index.html dist/ && cp -r public dist/ && cp -r public/* dist/"
  publish = "dist"

[[redirects]]
  from = "/vcard/nicky"
  to = "/"
  status = 200

[[redirects]]
  from = "/nicky"
  to = "/"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment"

[[headers]]
  for = "/public/vcf/*"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment"

[[headers]]
  for = "/vcf/*"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment"
